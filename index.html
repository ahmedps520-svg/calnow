<!doctype html>
<html lang="en" data-theme="mom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Calnow</title>
    <meta name="description" content="A private calorie and blood-sugar log shared between two phones." />
    <meta name="theme-color" content="#FBF6F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calnow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* If this file is ever served as-is instead of the built output — which is
         what happens when GitHub Pages publishes the repo root — the module
         above 404s and the page stays blank. Say so rather than showing white. */
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="font:15px/1.5 -apple-system,system-ui,sans-serif;color:#6d5f57;' +
            'max-width:34rem;margin:18vh auto;padding:0 24px;text-align:center">' +
            '<div style="font-size:20px;color:#2b2320;margin-bottom:10px">Calnow could not start</div>' +
            'This page was served straight from the repository instead of the built app. ' +
            'In GitHub \u2192 Settings \u2192 Pages, set <b>Source</b> to <b>GitHub Actions</b>, ' +
            'then reload.</div>';
        }
      }, 4000);
    </script>
  </body>
</html>
