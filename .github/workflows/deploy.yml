name: Deploy Calnow to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/diabetes-health-tracker-pwa-5numt3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # NOTE: this repo's Pages site must have Source = "GitHub Actions"
      # (Settings > Pages > Build and deployment). While it is set to "Deploy
      # from a branch", GitHub runs its own publisher on every push, which
      # serves the repo root -- the un-built Vite source -- and whichever
      # publisher finishes last wins, so the site flips between the real app
      # and a blank page. That setting can only be changed by a repo admin in
      # the UI: GITHUB_TOKEN gets 403 "Resource not accessible by integration"
      # on the Pages API, and configure-pages' enablement only covers creating
      # a site that does not exist yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
