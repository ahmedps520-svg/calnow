name: Deploy Calnow to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/diabetes-health-tracker-pwa-5numt3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # enablement:true switches the Pages site to build_type "workflow".
      # Without it, a site left on "Deploy from a branch" keeps running
      # GitHub's own publisher, which serves the repo root (the un-built
      # source) and races this job for the last word.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
